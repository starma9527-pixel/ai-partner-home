[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "18"

[[edge_functions]]
  path = "/api/ai-proxy"
  function = "ai-proxy"

[[edge_functions]]
  path = "/api/feedback"
  function = "feedback"

# Stats 使用 Serverless Function (Node.js)
# 零 npm 依赖，用原生 fetch 直接调用 Blobs HTTP API
# NETLIFY_BLOBS_CONTEXT 环境变量只在 Serverless Functions 中自动注入
[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
