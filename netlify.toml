[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[build.environment]
  NODE_VERSION = "18"

[[edge_functions]]
  path = "/api/ai-proxy"
  function = "ai-proxy"

[[edge_functions]]
  path = "/api/feedback"
  function = "feedback"

# Stats 使用 Serverless Function (Node.js)，不用 Edge Function
# 因为 @netlify/blobs 的上下文只在 Serverless Functions 中可用
[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
